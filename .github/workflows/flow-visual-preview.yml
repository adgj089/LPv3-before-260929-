name: Flow Visual Preview
on:
  push:
    branches: [before-step3-settings-261007]
    paths: ['.github/workflows/flow-visual-preview.yml', 'karadamake_gym_before_lp_v2.html']
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture Flow at viewport sizes
        run: |
          cat > /tmp/flow-preview.mjs <<'EOF'
          import { createRequire } from 'node:module';
          const require = createRequire(process.cwd() + '/package.json');
          const { chromium } = require('playwright');
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          fs.mkdirSync('flow-qa',{recursive:true});
          const results=[];
          for(const width of [1440,1200,1150,1101,1100,1080,1060,1025,1024,1000,834,768,767,390,320]){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            await page.goto('file://' + process.env.GITHUB_WORKSPACE + '/karadamake_gym_before_lp_v2.html');
            await page.locator('#flow').scrollIntoViewIfNeeded();
            await page.locator('#flow').screenshot({path:'flow-qa/flow-'+width+'.png'});
            const info=await page.evaluate(()=>{
              const flow=document.querySelector('#flow'),grid=flow.querySelector('.flow-grid'),cards=[...flow.querySelectorAll('.flow-step')],r=grid.getBoundingClientRect();
              const rects=cards.map(c=>{const b=c.getBoundingClientRect();return {left:b.left,right:b.right,top:b.top,bottom:b.bottom,scrollWidth:c.scrollWidth,clientWidth:c.clientWidth}});
              return {width:innerWidth,columns:getComputedStyle(grid).gridTemplateColumns,documentOverflow:document.documentElement.scrollWidth>innerWidth,flowOverflow:flow.scrollWidth>flow.clientWidth,cardOverflow:cards.some(c=>c.scrollWidth>c.clientWidth),rects};
            });
            const headerInfo=await page.evaluate(()=>{
              const root=document.documentElement;
              const rect=(selector)=>{
                const el=document.querySelector(selector);
                if(!el)return null;
                const r=el.getBoundingClientRect(),style=getComputedStyle(el);
                return {selector,display:style.display,position:style.position,whiteSpace:style.whiteSpace,left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),scrollWidth:el.scrollWidth,clientWidth:el.clientWidth};
              };
              const vw=root.clientWidth;
              const offenders=[...document.querySelectorAll('body *')].filter(el=>{
                const s=getComputedStyle(el);if(s.display==='none'||s.visibility==='hidden')return false;
                const r=el.getBoundingClientRect();
                return r.width>0&&(r.right>vw+1||r.left< -1);
              }).map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,className:typeof el.className==='string'?el.className.slice(0,100):'',id:el.id,left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1)};}).slice(0,35);
              return {innerWidth,clientWidth:vw,scrollWidth:root.scrollWidth,media767:matchMedia('(max-width:767px)').matches,media1023:matchMedia('(max-width:1023px)').matches,header:rect('header'),headerInner:rect('.header-inner'),logo:rect('.logo'),nav:rect('.desktop-nav'),cta:rect('.header-inner > .header-cta'),menuButton:rect('.menu-btn'),offenders};
            });
            info.headerDiagnostics=headerInfo;
            results.push(info);
            await page.close();
          }
          // Non-destructive interaction QA: browser actions only; do not edit LP.
          const interactionResults=[];
          for(const width of [1440,1101,1100,768,390,320]){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            const test={width,checks:[],errors:[]};
            const check=(name,pass,detail)=>test.checks.push({name,status:pass?'PASS':'FAIL',detail});
            try{
              await page.goto('file://' + process.env.GITHUB_WORKSPACE + '/karadamake_gym_before_lp_v2.html');
              const isMobile=width<=1100;
              const before=await page.locator('header').boundingBox();
              await page.evaluate(()=>window.scrollTo({top:Math.min(1200,document.documentElement.scrollHeight-900),behavior:'instant'}));
              await page.waitForTimeout(250);
              const after=await page.locator('header').boundingBox();
              const sticky=await page.locator('header').evaluate(e=>getComputedStyle(e).position);
              check('sticky_after_scroll',sticky==='sticky'&&Math.abs(after.y)<=2&&before.y>=-1,{position:sticky,beforeY:before.y,afterY:after.y});
              await page.screenshot({path:'flow-qa/header-scrolled-'+width+'.png'});
              await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
              await page.waitForTimeout(150);
              if(isMobile){
                const menu=page.locator('.menu-btn'),nav=page.locator('.mobile-menu');
                check('menu_button_visible',await menu.isVisible(),{});
                await menu.click();
                check('menu_opens',(await nav.isVisible())&&(await menu.getAttribute('aria-expanded'))==='true',{expanded:await menu.getAttribute('aria-expanded')});
                await page.screenshot({path:'flow-qa/header-menu-open-'+width+'.png'});
                await menu.click();
                check('menu_closes',!(await nav.isVisible())&&(await menu.getAttribute('aria-expanded'))==='false',{expanded:await menu.getAttribute('aria-expanded')});
                await menu.click();
                await nav.locator('a[href="#booking"]').click();
                check('menu_closes_after_booking',!(await nav.isVisible())&&(await menu.getAttribute('aria-expanded'))==='false',{hash:await page.evaluate(()=>location.hash)});
              }else{
                check('desktop_nav_visible',await page.locator('.desktop-nav').isVisible(),{});
                await page.locator('.header-inner > a[href="#booking"]').click();
              }
              await page.waitForTimeout(900);
              const anchorInfo=await page.evaluate(()=>{
                const h=document.querySelector('header').getBoundingClientRect(),b=document.querySelector('#booking').getBoundingClientRect();
                return {hash:location.hash,headerBottom:h.bottom,bookingTop:b.top,scrollY:scrollY,overflow:document.documentElement.scrollWidth>innerWidth};
              });
              check('booking_anchor',anchorInfo.hash==='#booking'&&anchorInfo.bookingTop>=anchorInfo.headerBottom-3&&anchorInfo.scrollY>0,anchorInfo);
              check('no_document_overflow',!anchorInfo.overflow,anchorInfo);
              await page.screenshot({path:'flow-qa/header-booking-'+width+'.png'});
            }catch(error){
              test.errors.push(String(error));
              check('interaction_execution',false,{error:String(error)});
            }finally{
              interactionResults.push(test);
              await page.close();
            }
          }
          fs.writeFileSync('flow-qa/header-interaction-qa.json',JSON.stringify(interactionResults,null,2));
          const failures=interactionResults.flatMap(t=>t.checks.filter(c=>c.status==='FAIL').map(c=>({width:t.width,...c})));
          fs.writeFileSync('flow-qa/header-interaction-summary.json',JSON.stringify({passed:failures.length===0,failures},null,2));
          fs.writeFileSync('flow-qa/diagnostics.json',JSON.stringify(results,null,2));
          await browser.close();
          EOF
          node /tmp/flow-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: flow-visual-preview
          path: flow-qa/
          retention-days: 7
      - name: Assert Header interaction QA
        if: always()
        run: |
          node -e "const r=require('./flow-qa/header-interaction-summary.json'); if(!r.passed){console.error(JSON.stringify(r.failures,null,2));process.exit(1)}"
