name: Flow Visual Preview
on:
  push:
    branches: [before-step3-settings-261007]
    paths: ['.github/workflows/flow-visual-preview.yml', 'karadamake_gym_before_lp_v2.html']
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture Flow at viewport sizes
        run: |
          cat > /tmp/flow-preview.mjs <<'EOF'
          import { createRequire } from 'node:module';
          const require = createRequire(process.cwd() + '/package.json');
          const { chromium } = require('playwright');
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          fs.mkdirSync('flow-qa',{recursive:true});
          const results=[];
          for(const width of [1440,1200,1150,1101,1100,1080,1060,1025,1024,1023,1000,834,768,767,390,360,359,320]){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            await page.goto('file://' + process.env.GITHUB_WORKSPACE + '/karadamake_gym_before_lp_v2.html');
            await page.locator('#flow').scrollIntoViewIfNeeded();
            await page.locator('#flow').screenshot({path:'flow-qa/flow-'+width+'.png'});
            const info=await page.evaluate(()=>{
              const flow=document.querySelector('#flow'),grid=flow.querySelector('.flow-grid'),cards=[...flow.querySelectorAll('.flow-step')],r=grid.getBoundingClientRect();
              const rects=cards.map(c=>{const b=c.getBoundingClientRect();return {left:b.left,right:b.right,top:b.top,bottom:b.bottom,scrollWidth:c.scrollWidth,clientWidth:c.clientWidth}});
              return {width:innerWidth,columns:getComputedStyle(grid).gridTemplateColumns,documentOverflow:document.documentElement.scrollWidth>innerWidth,flowOverflow:flow.scrollWidth>flow.clientWidth,cardOverflow:cards.some(c=>c.scrollWidth>c.clientWidth),rects};
            });
            const headerInfo=await page.evaluate(()=>{
              const root=document.documentElement;
              const rect=(selector)=>{
                const el=document.querySelector(selector);
                if(!el)return null;
                const r=el.getBoundingClientRect(),style=getComputedStyle(el);
                return {selector,display:style.display,position:style.position,whiteSpace:style.whiteSpace,left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),scrollWidth:el.scrollWidth,clientWidth:el.clientWidth};
              };
              const vw=root.clientWidth;
              const offenders=[...document.querySelectorAll('body *')].filter(el=>{
                const s=getComputedStyle(el);if(s.display==='none'||s.visibility==='hidden')return false;
                const r=el.getBoundingClientRect();
                return r.width>0&&(r.right>vw+1||r.left< -1);
              }).map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,className:typeof el.className==='string'?el.className.slice(0,100):'',id:el.id,left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1)};}).slice(0,35);
              return {innerWidth,clientWidth:vw,scrollWidth:root.scrollWidth,media767:matchMedia('(max-width:767px)').matches,media1023:matchMedia('(max-width:1023px)').matches,header:rect('header'),headerInner:rect('.header-inner'),logo:rect('.logo'),nav:rect('.desktop-nav'),cta:rect('.header-inner > .header-cta'),menuButton:rect('.menu-btn'),offenders};
            });
            info.headerDiagnostics=headerInfo;
            results.push(info);
            await page.close();
          }
          // Non-destructive interaction QA: browser actions only; do not edit LP.
          const interactionResults=[];
          for(const width of [1440,1101,1100,768,390,320]){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            const test={width,checks:[],errors:[]};
            const check=(name,pass,detail)=>test.checks.push({name,status:pass?'PASS':'FAIL',detail});
            try{
              await page.goto('file://' + process.env.GITHUB_WORKSPACE + '/karadamake_gym_before_lp_v2.html');
              const isMobile=width<=1100;
              const before=await page.locator('header').boundingBox();
              await page.evaluate(()=>window.scrollTo({top:Math.min(1200,document.documentElement.scrollHeight-900),behavior:'instant'}));
              await page.waitForTimeout(250);
              const after=await page.locator('header').boundingBox();
              const sticky=await page.locator('header').evaluate(e=>getComputedStyle(e).position);
              check('sticky_after_scroll',sticky==='sticky'&&Math.abs(after.y)<=2&&before.y>=-1,{position:sticky,beforeY:before.y,afterY:after.y});
              await page.screenshot({path:'flow-qa/header-scrolled-'+width+'.png'});
              await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
              await page.waitForTimeout(150);
              if(isMobile){
                const menu=page.locator('.menu-btn'),nav=page.locator('.mobile-menu');
                check('menu_button_visible',await menu.isVisible(),{});
                await menu.click();
                check('menu_opens',(await nav.isVisible())&&(await menu.getAttribute('aria-expanded'))==='true',{expanded:await menu.getAttribute('aria-expanded')});
                await page.screenshot({path:'flow-qa/header-menu-open-'+width+'.png'});
                await menu.click();
                check('menu_closes',!(await nav.isVisible())&&(await menu.getAttribute('aria-expanded'))==='false',{expanded:await menu.getAttribute('aria-expanded')});
                await menu.click();
                await nav.locator('a[href="#booking"]').click();
                check('menu_closes_after_booking',!(await nav.isVisible())&&(await menu.getAttribute('aria-expanded'))==='false',{hash:await page.evaluate(()=>location.hash)});
              }else{
                check('desktop_nav_visible',await page.locator('.desktop-nav').isVisible(),{});
                await page.locator('.header-inner > a[href="#booking"]').click();
              }
              // Wait for smooth scrolling to settle rather than assuming a fixed duration.
              await page.waitForFunction(()=>{
                const now=performance.now(),y=window.scrollY;
                const state=window.__bookingQAScrollState;
                if(!state||Math.abs(state.y-y)>0.5){
                  window.__bookingQAScrollState={y,since:now};
                  return false;
                }
                return now-state.since>=300;
              },null,{timeout:10000,polling:100});
              const anchorInfo=await page.evaluate(()=>{
                const h=document.querySelector('header').getBoundingClientRect(),b=document.querySelector('#booking').getBoundingClientRect();
                const maxScroll=Math.max(0,document.documentElement.scrollHeight-innerHeight);
                return {hash:location.hash,headerBottom:h.bottom,bookingTop:b.top,bookingBottom:b.bottom,viewportHeight:innerHeight,scrollY:scrollY,maxScroll,overflow:document.documentElement.scrollWidth>innerWidth};
              });
              const bookingInView=anchorInfo.bookingTop>=anchorInfo.headerBottom-3&&anchorInfo.bookingTop<=anchorInfo.viewportHeight-40;
              check('booking_anchor',anchorInfo.hash==='#booking'&&anchorInfo.scrollY>0&&bookingInView,anchorInfo);
              check('no_document_overflow',!anchorInfo.overflow,anchorInfo);
              await page.screenshot({path:'flow-qa/header-booking-'+width+'.png'});
            }catch(error){
              test.errors.push(String(error));
              check('interaction_execution',false,{error:String(error)});
            }finally{
              interactionResults.push(test);
              await page.close();
            }
          }

          // STEP4: full-page visual captures, layout/asset checks, and non-destructive interactions.
          const step4Widths=[1440,1200,1101,1100,1024,1023,834,768,767,390,360,359,320];
          const step4Results=[];
          fs.mkdirSync('flow-qa/trainer',{recursive:true});
          fs.mkdirSync('flow-qa/full-page',{recursive:true});
          for(const width of step4Widths){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            const record={width,checks:[],metrics:{},errors:[]};
            const check=(name,pass,detail)=>record.checks.push({name,status:pass?'PASS':'FAIL',detail});
            try{
              await page.goto('file://' + process.env.GITHUB_WORKSPACE + '/karadamake_gym_before_lp_v2.html');
              await page.locator('#trainer').scrollIntoViewIfNeeded();
              await page.locator('#trainer').screenshot({path:'flow-qa/trainer/trainer-'+width+'.png'});
              await page.screenshot({path:'flow-qa/full-page/full-'+width+'.png',fullPage:true,animations:'disabled'});
              const metrics=await page.evaluate(()=>{
                const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};};
                const cards=[...document.querySelectorAll('#trainer .trainer')].map(card=>{
                  const photo=card.querySelector('.trainer-main'),content=card.querySelector('.trainer-content'),image=card.querySelector('.trainer-scene');
                  return {card:rect(card),photo:rect(photo),content:rect(content),contentInnerWidth:content.clientWidth-parseFloat(getComputedStyle(content).paddingLeft)-parseFloat(getComputedStyle(content).paddingRight),photoSrc:photo.currentSrc,photoLoaded:photo.complete&&photo.naturalWidth>0,sceneLoaded:image.complete&&image.naturalWidth>0};
                });
                const images=[...document.images].map(img=>({src:img.getAttribute('src'),loaded:img.complete&&img.naturalWidth>0}));
                const root=document.documentElement;
                return {viewport:innerWidth,scrollWidth:root.scrollWidth,trainerCount:cards.length,cards,images,flowSteps:document.querySelectorAll('#flow .flow-step').length,faqCount:document.querySelectorAll('.faq-q').length,formCount:document.querySelectorAll('.demo-form').length};
              });
              record.metrics=metrics;
              check('no_page_horizontal_overflow',metrics.scrollWidth<=width+1,{scrollWidth:metrics.scrollWidth});
              check('trainer_count',metrics.trainerCount===3,{count:metrics.trainerCount});
              check('flow_step_count',metrics.flowSteps===4,{count:metrics.flowSteps});
              check('all_images_loaded',metrics.images.every(x=>x.loaded),metrics.images.filter(x=>!x.loaded));
              check('sato_image_selection',metrics.cards.length===3&&(width<=767?metrics.cards[2].photoSrc.includes('trainer-sato-mobile.webp'):metrics.cards[2].photoSrc.includes('trainer-sato.webp')),{src:metrics.cards[2]?.photoSrc});
              // Objective minimum width guard. A visual PASS still requires manual screenshot inspection.
              record.metrics.trainerTextWidths=metrics.cards.map(x=>({contentInnerWidth:x.contentInnerWidth,referenceMinimum:190}));
              check('trainer_photo_text_separation',metrics.cards.every(x=>x.photo.bottom<=x.content.y+2||x.photo.right<=x.content.x+2),metrics.cards.map(x=>({photo:x.photo,content:x.content})));
            }catch(error){record.errors.push(String(error));check('step4_capture_execution',false,{error:String(error)});}
            finally{step4Results.push(record);await page.close();}
          }
          const interactionWidths=[1440,1101,1100,768,390,320];
          for(const width of interactionWidths){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            const rec=step4Results.find(x=>x.width===width);
            const check=(name,pass,detail)=>rec.checks.push({name,status:pass?'PASS':'FAIL',detail});
            try{
              await page.goto('file://' + process.env.GITHUB_WORKSPACE + '/karadamake_gym_before_lp_v2.html');
              const faq=page.locator('.faq-q');
              check('faq_question_count',await faq.count()===8,{count:await faq.count()});
              for(let i=0;i<await faq.count();i++){
                const button=faq.nth(i),item=button.locator('xpath=..');
                await button.click();
                check('faq_'+(i+1)+'_open',await item.evaluate(e=>e.classList.contains('open')),{});
                await button.click();
                check('faq_'+(i+1)+'_close',!(await item.evaluate(e=>e.classList.contains('open'))),{});
              }
              const forms=page.locator('form.demo-form');
              check('form_count',await forms.count()===2,{count:await forms.count()});
              for(let i=0;i<await forms.count();i++){
                const form=forms.nth(i);
                const required=await form.locator('[required]').count();
                const emptyBlocked=await form.evaluate(e=>!e.checkValidity());
                check('form_'+(i+1)+'_required_validation',required>0&&emptyBlocked,{required});
                await form.locator('input[type="text"]').first().fill('QA Test');
                await form.locator('input[type="email"]').first().fill('qa@example.invalid');
                const remaining=await form.locator('[required]');
                for(let j=0;j<await remaining.count();j++){
                  const el=remaining.nth(j),valid=await el.evaluate(e=>e.checkValidity());
                  if(!valid){
                    const tag=await el.evaluate(e=>e.tagName.toLowerCase());
                    if(tag==='select'){const values=await el.locator('option').evaluateAll(opts=>opts.map(o=>o.value).filter(Boolean));if(values.length)await el.selectOption(values[0]);}
                    else await el.fill('QA only');
                  }
                }
                const valid=await form.evaluate(e=>e.checkValidity());
                check('form_'+(i+1)+'_valid_inputs',valid,{});
                if(valid){
                  page.once('dialog',dialog=>dialog.accept());
                  await form.locator('button[type="submit"],input[type="submit"],button:not([type])').first().click({timeout:4000});
                  check('form_'+(i+1)+'_stays_on_demo_page',await page.locator('#trainer').count()===1,{});
                }
              }
            }catch(error){rec.errors.push(String(error));check('step4_interaction_execution',false,{error:String(error)});}
            finally{await page.close();}
          }
          const failed=step4Results.flatMap(r=>r.checks.filter(c=>c.status==='FAIL').map(c=>({width:r.width,...c})));
          fs.writeFileSync('flow-qa/step4-diagnostics.json',JSON.stringify(step4Results,null,2));
          fs.writeFileSync('flow-qa/step4-summary.json',JSON.stringify({passed:failed.length===0,failures:failed,visualReview:'NOT TESTED - inspect full-page screenshots manually'},null,2));

          fs.writeFileSync('flow-qa/header-interaction-qa.json',JSON.stringify(interactionResults,null,2));
          const failures=interactionResults.flatMap(t=>t.checks.filter(c=>c.status==='FAIL').map(c=>({width:t.width,...c})));
          fs.writeFileSync('flow-qa/header-interaction-summary.json',JSON.stringify({passed:failures.length===0,failures},null,2));
          fs.writeFileSync('flow-qa/diagnostics.json',JSON.stringify(results,null,2));
          // STEP5: published Pages form QA (read-only; synthetic data only).
          const publishedUrl='https://adgj089.github.io/LPv3-before-260929-/karadamake_gym_before_lp_v2.html';
          const expectedAlert='このフォームはデモ用のため、実際には送信されません。';
          const formQa=[];
          for(const width of [390,768,1440,320]){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            const record={width,target:'published GitHub Pages',checks:[],errors:[]};
            const check=(name,pass,detail)=>record.checks.push({name,status:pass?'PASS':'FAIL',detail});
            const submissions=[];
            const handleRequest=request=>{
              if(['POST','PUT','PATCH','DELETE'].includes(request.method()))
                submissions.push({method:request.method(),url:request.url()});
            };
            page.on('request',handleRequest);
            try{
              const response=await page.goto(publishedUrl,{waitUntil:'domcontentloaded',timeout:30000});
              check('public_page_http_ok',!!response&&response.ok(),{status:response?.status()});
              const publishedMarker=await page.locator('#booking button[type="submit"]').innerText();
              check('published_step5_copy',publishedMarker.trim()==='予約フォームのデモを確認する',{text:publishedMarker});
              const initialOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              check('no_horizontal_overflow',initialOverflow<=1,{overflowPx:initialOverflow});
              await page.locator('#booking').screenshot({path:'flow-qa/step5-booking-'+width+'.png'});
              if(width!==320){
                for(const [formId,selector,firstRequired] of [
                  ['booking','#booking form.demo-form','r-name'],
                  ['contact','#contact form.demo-form','c-name']
                ]){
                  const form=page.locator(selector);
                  const button=form.locator('button[type="submit"]');
                  check(formId+'_form_exists',await form.count()===1,{});
                  let invalidCount=0;
                  await form.evaluate(node=>node.addEventListener('invalid',()=>{},true));
                  const invalidListener=()=>{invalidCount++};
                  // Count actual invalid events produced by a user-like submit.
                  await form.evaluate(node=>{node.dataset.qaInvalidCount='0';node.addEventListener('invalid',()=>{node.dataset.qaInvalidCount=String(Number(node.dataset.qaInvalidCount)+1)},true)});
                  let blankDialogCount=0;
                  const unexpectedDialog=async dialog=>{blankDialogCount++;await dialog.dismiss()};
                  page.on('dialog',unexpectedDialog);
                  const urlBefore=page.url();
                  await button.click();
                  const blankValidity=await form.evaluate(node=>node.checkValidity());
                  const focus=await page.evaluate(()=>document.activeElement?.id||null);
                  const invalidEvents=Number(await form.getAttribute('data-qa-invalid-count'));
                  check(formId+'_empty_invalid',!blankValidity&&invalidEvents>0,{invalidEvents});
                  check(formId+'_focus_first_required',focus===firstRequired,{expected:firstRequired,actual:focus});
                  check(formId+'_empty_no_dialog',blankDialogCount===0,{count:blankDialogCount});
                  check(formId+'_empty_no_navigation',page.url()===urlBefore,{url:page.url()});
                  page.off('dialog',unexpectedDialog);
                  await form.locator('input[type="text"]').first().fill('QA Test');
                  await form.locator('input[type="email"]').first().fill('qa@example.invalid');
                  if(formId==='contact')await form.locator('textarea[required]').fill('QA test only');
                  check(formId+'_valid_inputs',await form.evaluate(node=>node.checkValidity()),{});
                  let dialogData=null;
                  const dialogPromise=page.waitForEvent('dialog',{timeout:6000}).then(async dialog=>{
                    dialogData={type:dialog.type(),message:dialog.message()};
                    await dialog.accept();
                  });
                  await button.click();
                  await dialogPromise;
                  check(formId+'_alert_type',dialogData?.type==='alert',dialogData);
                  check(formId+'_alert_exact_text',dialogData?.message===expectedAlert,dialogData);
                  check(formId+'_valid_no_navigation',page.url()===urlBefore,{url:page.url()});
                }
                check('no_mutating_network_requests',submissions.length===0,{requests:submissions});
              }else{
                check('mobile_320_layout_only',true,{note:'Form interactions covered at 390/768/1440'});
              }
            }catch(error){
              record.errors.push(String(error));
              check('published_form_qa_execution',false,{error:String(error)});
            }finally{
              formQa.push(record);
              await page.close();
            }
          }
          const formFailures=formQa.flatMap(r=>r.checks.filter(c=>c.status==='FAIL').map(c=>({width:r.width,...c})));
          fs.writeFileSync('flow-qa/step5-form-qa.json',JSON.stringify(formQa,null,2));
          fs.writeFileSync('flow-qa/step5-form-summary.json',JSON.stringify({passed:formFailures.length===0,failures:formFailures,publishedUrl,visualReview:'NOT TESTED - screenshots require manual review'},null,2));
          // STEP6-6: Read-only FAQ expansion and native validity UI diagnostics on the working HTML.
          const step66=[];
          fs.mkdirSync('flow-qa/step6-6',{recursive:true});
          for(const width of [320,390,768,1440]){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            const result={width,target:'working branch HTML',faq:[],forms:[],errors:[]};
            try{
              await page.goto('file://' + process.env.GITHUB_WORKSPACE + '/karadamake_gym_before_lp_v2.html');
              const buttons=page.locator('#faq .faq-q');
              for(let i=0;i<await buttons.count();i++){
                await buttons.nth(i).click();
                await page.waitForTimeout(320);
                const data=await buttons.nth(i).evaluate(btn=>{
                  const item=btn.closest('.faq-item'),answer=item.querySelector('.faq-a');
                  return {open:item.classList.contains('open'),scrollHeight:answer.scrollHeight,clientHeight:answer.clientHeight,visibleText:answer.innerText,ariaExpanded:btn.getAttribute('aria-expanded')};
                });
                result.faq.push({number:i+1,...data,unclipped:data.scrollHeight<=data.clientHeight+2});
                await buttons.nth(i).click();
              }
              for(const id of ['booking','contact']){
                const form=page.locator('#'+id+' form.demo-form'),button=form.locator('button[type="submit"]');
                await button.click();
                const data=await form.evaluate(node=>{
                  const invalid=[...node.querySelectorAll('input,textarea,select')].filter(el=>!el.checkValidity());
                  return {valid:node.checkValidity(),activeId:document.activeElement?.id,invalid:invalid.map(el=>({id:el.id,message:el.validationMessage,validity:{valueMissing:el.validity.valueMissing,typeMismatch:el.validity.typeMismatch}}))};
                });
                result.forms.push({id,...data,expectedFocus:id==='booking'?'r-name':'c-name',invalidBlocked:!data.valid,focusCorrect:data.activeId===(id==='booking'?'r-name':'c-name'),nativeBubbleVisual:'NOT TESTED - browser-native validation popup may not be captured'});
                await page.screenshot({path:'flow-qa/step6-6/'+id+'-invalid-'+width+'.png',animations:'disabled'});
              }
              // Capture all answers simultaneously to permit visual review of expanded FAQ.
              await page.locator('#faq .faq-q').evaluateAll(buttons=>buttons.forEach(btn=>btn.closest('.faq-item').classList.add('open')));
              await page.waitForTimeout(320);
              await page.locator('#faq').screenshot({path:'flow-qa/step6-6/faq-open-'+width+'.png',animations:'disabled'});
            }catch(error){result.errors.push(String(error));}
            finally{step66.push(result);await page.close();}
          }
          fs.writeFileSync('flow-qa/step6-6/diagnostics.json',JSON.stringify(step66,null,2));
          fs.writeFileSync('flow-qa/step6-6/summary.json',JSON.stringify({pass:step66.every(r=>r.errors.length===0&&r.faq.length===8&&r.faq.every(f=>f.open&&f.unclipped)&&r.forms.length===2&&r.forms.every(f=>f.invalidBlocked&&f.focusCorrect)),visualReview:'NOT TESTED - inspect screenshots and native warning UI separately'},null,2));
          // STEP6-6: booking time interval validation on the working-branch HTML only.
          const timeChecks=[];
          for(const width of [320,390,768,1440]){
            const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
            const record={width,checks:[],errors:[]};
            const check=(name,pass,details)=>record.checks.push({name,status:pass?'PASS':'FAIL',details});
            try{
              await page.goto('file://' + process.env.GITHUB_WORKSPACE + '/karadamake_gym_before_lp_v2.html');
              const field=page.locator('#r-date'),form=page.locator('#booking form.demo-form');
              check('step_attribute',await field.getAttribute('step')==='1800',{step:await field.getAttribute('step')});
              check('optional_datetime',!(await field.evaluate(el=>el.required)),{});
              for(const [label,value,shouldPass] of [
                ['empty','',true],['0900','2026-11-10T09:00',true],
                ['0930','2026-11-10T09:30',true],['1000','2026-11-10T10:00',true],
                ['0915','2026-11-10T09:15',false],['0945','2026-11-10T09:45',false],
                ['0901','2026-11-10T09:01',false]
              ]){
                await field.fill(value);
                const data=await field.evaluate(el=>({value:el.value,valid:el.checkValidity(),stepMismatch:el.validity.stepMismatch}));
                check('value_'+label,data.valid===shouldPass&&(!shouldPass?data.stepMismatch:true),data);
              }
              await form.locator('#r-name').fill('QA Test');
              await form.locator('#r-mail').fill('qa@example.invalid');
              let alertCount=0;
              page.on('dialog',async dialog=>{alertCount++;await dialog.accept()});
              await field.fill('2026-11-10T09:15');
              await form.locator('button[type="submit"]').click();
              check('invalid_submit_blocked',alertCount===0&&!(await form.evaluate(el=>el.checkValidity())),{alertCount});
              await field.fill('2026-11-10T09:30');
              await form.locator('button[type="submit"]').click();
              check('valid_submit_demo_alert',alertCount===1,{alertCount});
              check('no_navigation',page.url().startsWith('file:'),{url:page.url()});
            }catch(error){record.errors.push(String(error));}
            finally{timeChecks.push(record);await page.close();}
          }
          const timeFailures=timeChecks.flatMap(r=>r.errors.map(error=>({width:r.width,error})).concat(r.checks.filter(c=>c.status==='FAIL').map(c=>({width:r.width,...c}))));
          fs.writeFileSync('flow-qa/step6-6/time-validation.json',JSON.stringify(timeChecks,null,2));
          fs.writeFileSync('flow-qa/step6-6/time-validation-summary.json',JSON.stringify({passed:timeFailures.length===0,failures:timeFailures,pickerVisual:'NOT TESTED'},null,2));
          await browser.close();
          EOF
          node /tmp/flow-preview.mjs
